<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>現代を生きる"睡眠力"診断 — 睡眠を妨げる行動のクセを読み解く</title>
<style>
  :root{
    --bg:#0b0e14; --bg2:#111725; --card:#161d2b; --line:#26304a;
    --ink:#e9e6dc; --sub:#9aa3b5; --accent:#c8b273; --accent2:#7fa6c4; --bad:#c98a7a;
    --good:#8bbf9f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    background:radial-gradient(1200px 600px at 50% -10%,#182236 0%,var(--bg) 55%);
    color:var(--ink); line-height:1.8; min-height:100vh; padding:24px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px;margin:0 auto}
  .brand{text-align:center;letter-spacing:.3em;font-size:12px;color:var(--accent);margin-bottom:6px}
  .card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
    border-radius:16px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .btn{display:block;width:100%;text-align:center;cursor:pointer;border:none;border-radius:12px;
    padding:15px;font-family:inherit;font-size:16px;letter-spacing:.05em;
    background:linear-gradient(180deg,var(--accent),#a8925a);color:#1a1305;font-weight:600;
    transition:transform .08s ease,opacity .2s}
  .btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(0)}
  .prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
  .prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));width:0;transition:width .3s}
  .intro-note{font-size:13.5px;color:#c9c5b8;line-height:1.9;background:#131a28;border:1px solid var(--line);
    border-radius:12px;padding:14px 16px;margin-bottom:18px}
  @keyframes aiPulse{0%,100%{opacity:.55}50%{opacity:1}}
  .ai-core{animation:aiPulse 3.2s ease-in-out infinite}
  #aiVisual .gs{opacity:0;transition:opacity 1.1s ease}
  /* タイプ別イラストのアニメーション */
  .typesvg-wrap{margin:10px 0 2px}
  @keyframes tiScrollAnim{to{transform:translateY(-84px)}}
  .ti-scroll{animation:tiScrollAnim 6s linear infinite}
  @keyframes tiBlink{0%,100%{opacity:.25}50%{opacity:1}}
  .ti-blink{animation:tiBlink 2.2s ease-in-out infinite}
  @keyframes tiFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .ti-float{animation:tiFloat 3.4s ease-in-out infinite}
  @keyframes tiSteam{0%{transform:translateY(4px);opacity:0}30%{opacity:.7}100%{transform:translateY(-16px);opacity:0}}
  .ti-steam{animation:tiSteam 3s ease-out infinite}
  .ti-steam2{animation:tiSteam 3s ease-out 1.5s infinite}
  @keyframes tiWaveAnim{to{transform:translateX(-60px)}}
  .ti-wave{animation:tiWaveAnim 5s linear infinite}
  /* シナプスイラスト: 後挿入SVGはSMILもCSSキーフレームも環境により動かないため、
     Web Animations API(シナプス起動)で動かす。回転の基準点だけCSSで指定する */
  .syn-rot{transform-box:view-box;transform-origin:50% 50%}
  .intro-note b{color:var(--accent)}
  .intro-note p+p{margin-top:8px}
  .qhead{text-align:center;font-size:19px;font-weight:600;letter-spacing:.06em;margin-bottom:6px;color:var(--ink)}
  .phase{text-align:center;font-size:12px;color:var(--accent2);letter-spacing:.1em;margin-bottom:16px;min-height:18px}
  .q{font-size:19px;font-weight:600;margin:6px 0 22px;letter-spacing:.02em;min-height:64px;display:flex;align-items:center}
  .opts{display:flex;flex-direction:column;gap:10px}
  button{-webkit-tap-highlight-color:transparent}
  .opt{cursor:pointer;border:1px solid var(--line);background:#131a28;border-radius:12px;padding:14px 16px;
    font-size:15px;color:var(--ink);transition:all .12s;text-align:left;font-family:inherit}
  .opt:focus,.back:focus,.btn:focus,.btn2:focus{outline:none}
  @media(hover:hover){
    .opt:hover{border-color:var(--accent2);background:#17202f}
    .back:hover{color:var(--ink)}
  }
  .back{background:none;border:none;color:var(--sub);font-family:inherit;font-size:13px;cursor:pointer;margin-top:18px}
  .score-wrap{text-align:center;margin:4px 0 20px}
  .typeimg-wrap{text-align:center;margin:16px 0 6px}
  .typeimg{width:min(320px,85%);filter:drop-shadow(0 12px 26px rgba(0,0,0,.5))}
  .score-num{font-size:56px;font-weight:700;color:var(--accent);line-height:1}
  .score-lab{font-size:13px;color:var(--sub);letter-spacing:.2em;margin-top:6px}
  .delta{font-size:14px;margin-top:8px;font-weight:600}
  .delta.up{color:var(--good)} .delta.down{color:var(--bad)}
  .hist{margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:11px;color:var(--sub)}
  .hist span{border:1px solid var(--line);border-radius:6px;padding:2px 8px}
  .feat{background:#1a2130;border:1px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:14px;color:#e9e2cf;line-height:1.75;margin-bottom:4px}
  h2{font-size:18px;margin:24px 0 10px;letter-spacing:.04em;border-left:3px solid var(--accent);padding-left:12px}
  p.body{font-size:15px;color:#d8d4c8;margin-bottom:10px}
  .bars{margin:6px 0}
  .bar{margin:11px 0}
  .bar .bl{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:4px}
  .bar .bt{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
  .bar .bf{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
  .bar.top .bf{background:linear-gradient(90deg,#c98a7a,var(--accent))}
  .bar.top .bl b{color:var(--bad)}
  /* 無料の診断カード */
  .diag{border:1px solid var(--line);border-radius:14px;margin:16px 0;overflow:hidden;background:#121927}
  .diag .dh{padding:14px 18px;background:linear-gradient(180deg,#1a2233,#141c2b);border-bottom:1px solid var(--line)}
  .diag .dh .dt{font-size:16px;font-weight:600;color:var(--ink)}
  .diag .dh .ds{font-size:12px;color:var(--sub);margin-top:2px}
  .diag .dh .pri{display:inline-block;font-size:11px;color:#1a1305;background:var(--accent);border-radius:6px;padding:1px 8px;margin-left:8px;vertical-align:2px}
  .diag .db{padding:16px 18px}
  .fact{background:#1a2130;border-left:3px solid var(--accent);border-radius:0 10px 0 0;
    padding:12px 14px;font-size:14px;color:#e8e1cb;line-height:1.9;margin-bottom:0}
  .factimg{margin:0 0 14px;border-radius:0 0 10px 10px;overflow:hidden;border:1px solid var(--line);border-top:none}
  .factimg img{display:block;width:100%;height:auto}
  .diag .mech{font-size:14px;color:#d2cec2;line-height:1.85;margin-bottom:12px}
  .lab{font-size:12px;letter-spacing:.15em;color:var(--accent2);margin:12px 0 6px}
  .acts{list-style:none;font-size:14px;color:#d8d4c8}
  .acts li{padding:8px 0 8px 22px;border-bottom:1px dashed var(--line);position:relative;line-height:1.75}
  .acts li:before{content:"◆";position:absolute;left:2px;color:var(--accent);font-size:10px;top:13px}
  /* premium */
  .prem{position:relative;margin-top:22px;border:1px solid var(--accent);border-radius:14px;overflow:hidden}
  .prem .head{background:linear-gradient(180deg,#1d2436,#161d2b);padding:16px 18px;border-bottom:1px solid var(--line)}
  .prem .head .t{font-size:16px;font-weight:600;color:var(--accent)}
  .prem .head .s{font-size:12px;color:var(--sub);margin-top:3px}
  .locked{padding:18px}
  .locked ul{list-style:none;font-size:14px;color:#cfcbbf}
  .locked li{padding:7px 0;border-bottom:1px dashed var(--line);filter:blur(3.5px);user-select:none}
  .lockbar{padding:16px 18px;background:#131a28;text-align:center}
  .price{font-size:22px;font-weight:700;color:var(--ink)}.price small{font-size:13px;color:var(--sub);font-weight:400}
  .prem h3{font-size:15px;color:var(--accent);margin:0 0 8px;letter-spacing:.03em}
  .prem .rep{list-style:none;font-size:14px;color:#d2cec2;margin:4px 0 8px}
  .prem .rep li{padding:9px 0;border-bottom:1px solid var(--line);line-height:1.75}
  .prem .rep li b{color:var(--ink)}
  .sec{padding:16px 18px;border-top:1px solid var(--line)}
  .sec .sc{font-size:12px;color:var(--sub);font-weight:400}
  .goods{list-style:none;font-size:13.5px}
  .goods li{padding:9px 0;border-bottom:1px dashed var(--line);line-height:1.7}
  .goods .pr{color:var(--accent);font-weight:600}
  .goods .gn{color:var(--sub);font-size:12.5px}
  .goods .amz{color:var(--accent2);font-size:12px;text-decoration:none;border:1px solid var(--accent2);border-radius:6px;padding:2px 9px;white-space:nowrap}
  .goods .amz:hover{background:#17202f}
  .svc2{background:#12202a;border:1px solid #2c4658;border-radius:10px;padding:12px 14px;font-size:13.5px;color:#d6e2ea;line-height:1.75}
  .svc2 b{color:var(--good)}
  .btn2{display:block;width:100%;text-align:center;cursor:pointer;border:1px solid var(--good);
    border-radius:10px;padding:13px;font-family:inherit;font-size:15px;color:#0b1410;font-weight:600;
    background:linear-gradient(180deg,#8bbf9f,#6ba585)}
  .testnote{font-size:12px;color:var(--sub);margin-top:16px;background:#131a28;border:1px solid var(--line);border-radius:10px;padding:12px}
  .prem .intro{font-size:14px;color:#cfcbbf;padding:18px 18px 0}
  .disc{margin-top:26px;font-size:11px;color:#6f778a;line-height:1.7;border-top:1px solid var(--line);padding-top:16px}
  .hidden{display:none}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media(max-width:480px){.q{font-size:17px}.score-num{font-size:46px}}
  .paidnote{background:#15251b;border:1px solid var(--good);color:var(--good);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;text-align:center}
  .mailin{display:block;width:100%;margin-top:12px;padding:13px 14px;border-radius:10px;border:1px solid var(--line);
    background:#0f1522;color:var(--ink);font-family:inherit;font-size:15px}
  .mailin:focus{outline:none;border-color:var(--accent2)}
  .mailin::placeholder{color:#5d6577}
  /* PDF保存用: 印刷時は白背景・黒文字に変換し、操作ボタン類を隠す */
  @media print{
    body{background:#fff !important;color:#111;padding:0}
    .brand{color:#666}
    #quiz,.back,.lockbar,.noprint,.btn,.btn2,.factimg{display:none !important}
    .card{background:#fff;border:none;box-shadow:none;padding:0}
    .score-num{color:#111}
    .score-lab,.hist,.bar .bl{color:#444}
    .hist span{border-color:#ccc}
    .delta.up{color:#2c7a4b}.delta.down{color:#a33}
    h2{color:#111;border-left-color:#888}
    p.body,.mech,.acts,.rep,.goods{color:#222}
    .diag,.prem{background:#fff;border-color:#bbb}
    .diag .dh,.prem .head{background:#f2f2f2;border-color:#ccc}
    .diag .dh .dt,.prem .head .t,.prem h3{color:#111}
    .diag .dh .ds,.prem .head .s,.lab,.sec .sc,.goods .gn{color:#555}
    .fact{background:#f7f7f7;border-color:#888;color:#222}
    .feat{background:#f7f7f7;border-color:#999;color:#111}
    .svc2{background:#f7f7f7;border-color:#bbb;color:#222}
    .svc2 b{color:#2c7a4b}
    .acts li:before{color:#888}
    .goods .pr{color:#111}
    .goods .amz{display:none}
    .bar .bt{background:#eee}.bar .bf{background:#999}
    .bar.top .bf{background:#c66}
    .pri{background:#333;color:#fff}
    .paidnote{background:#f2f8f4;color:#2c7a4b;border-color:#9c9}
    .testnote,.disc{display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <section id="quiz" class="card fade">
    <div id="intro" class="intro-note">
      <p style="font-size:15.5px;color:var(--ink)">これは、睡眠を妨げる<b>行動のクセ</b>を読み解く、無料のセルフチェックです。</p>
      <p>意志の強さや体質で片付けず<b style="color:var(--bad)">「なぜ睡眠の満足度が低いのか」</b>を行動の側から、原因分析します。気になるところだけを深掘りする方式なので、1〜3分で終わります。</p>
    </div>
    <div class="qhead" id="qhead">現代を生きる"睡眠力"診断</div>
    <div class="phase" id="phase"></div>
    <div id="aiVisual" style="margin:2px 0 14px">
      <svg viewBox="0 0 680 200" width="100%" role="img" aria-label="回答が進むほど成長するAI頭脳のイメージ" xmlns="http://www.w3.org/2000/svg" style="display:block">
        <defs>
          <radialGradient id="aiHalo" cx="50%" cy="46%" r="52%">
            <stop offset="0%" stop-color="#7fa6c4" stop-opacity=".3"/>
            <stop offset="60%" stop-color="#7fa6c4" stop-opacity=".1"/>
            <stop offset="100%" stop-color="#7fa6c4" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="coreGold" cx="42%" cy="38%" r="70%">
            <stop offset="0%" stop-color="#f2e2ae"/>
            <stop offset="55%" stop-color="#c8b273"/>
            <stop offset="100%" stop-color="#8a7846"/>
          </radialGradient>
          <linearGradient id="aiWave" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#7fa6c4" stop-opacity="0"/>
            <stop offset="55%" stop-color="#7fa6c4" stop-opacity=".9"/>
            <stop offset="100%" stop-color="#c8b273" stop-opacity=".2"/>
          </linearGradient>
          <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="4"/>
          </filter>
        </defs>

        <!-- 段階0(常時): 入力の脳波とコア -->
        <g class="gs" data-s="0">
          <ellipse cx="340" cy="92" rx="260" ry="86" fill="url(#aiHalo)"/>
          <path d="M24 92 H140 l12 0 l9 -20 l10 38 l9 -50 l10 52 l9 -28 l11 8 H262" fill="none" stroke="url(#aiWave)" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="110" cy="92" r="2.2" fill="#7fa6c4" opacity=".7"/>
          <circle cx="62" cy="92" r="1.6" fill="#7fa6c4" opacity=".45"/>
          <g class="ai-core">
            <circle cx="340" cy="92" r="17" fill="#c8b273" opacity=".3" filter="url(#soft)"/>
            <circle cx="340" cy="92" r="10" fill="url(#coreGold)"/>
            <circle cx="336" cy="88" r="3" fill="#f6ecc9" opacity=".8"/>
          </g>
        </g>

        <!-- 段階1: コア周辺に最初のシナプス -->
        <g class="gs" data-s="1">
          <g stroke="#7fa6c4" stroke-opacity=".42" stroke-width=".8" fill="none">
            <path d="M330 84 L340 62 M330 84 L356 88 M356 88 L340 62 M316 72 L330 84 M356 88 L362 112"/>
          </g>
          <circle cx="330" cy="84" r="2" fill="#e9e6dc" opacity=".6"/>
          <circle cx="340" cy="62" r="2.5" fill="#c8b273"/>
          <circle cx="356" cy="88" r="2.8" fill="#c8b273"/>
          <circle cx="316" cy="72" r="2.2" fill="#7fa6c4"/>
          <circle cx="362" cy="112" r="2.6" fill="#c8b273"/>
        </g>

        <!-- 段階2: 手前のニューラルメッシュが広がる -->
        <g class="gs" data-s="2">
          <g stroke="#7fa6c4" stroke-opacity=".42" stroke-width=".8" fill="none">
            <path d="M316 72 L340 62 L363 72 L377 94 L362 112 L352 130 L332 122 L316 108 L305 92 L316 72"/>
            <path d="M330 84 L305 92 M330 84 L316 108 M356 88 L363 72 M356 88 L377 94 M316 108 L332 122 M362 112 L332 122"/>
          </g>
          <circle cx="363" cy="72" r="2.2" fill="#7fa6c4"/>
          <circle cx="377" cy="94" r="2.4" fill="#7fa6c4"/>
          <circle cx="352" cy="130" r="2" fill="#7fa6c4"/>
          <circle cx="332" cy="122" r="2.4" fill="#7fa6c4"/>
          <circle cx="316" cy="108" r="2.6" fill="#c8b273"/>
          <circle cx="305" cy="92" r="2.4" fill="#7fa6c4"/>
        </g>

        <!-- 段階3: 金色のクロスリンク -->
        <g class="gs" data-s="3" stroke="#c8b273" stroke-opacity=".3" stroke-width=".8" fill="none">
          <path d="M340 62 L356 88 M356 88 L332 122 M305 92 L356 88 M316 72 L362 112 M316 108 L340 62 M330 84 L362 112 M356 88 L383 86"/>
        </g>

        <!-- 段階4: 中間層の点群 -->
        <g class="gs" data-s="4">
          <g stroke="#7fa6c4" stroke-opacity=".2" stroke-width=".7" fill="none">
            <path d="M322 48 L352 54 L374 66 L383 86 L378 108 L360 126 L326 128 L298 110 L300 88 L312 60 L322 48"/>
            <path d="M312 60 L352 54 M300 88 L322 48 M383 86 L352 54 M298 110 L326 128 M378 108 L383 86 M300 88 L298 110 M374 66 L378 108 M340 62 L322 48 M363 72 L374 66 M377 94 L383 86 M305 92 L300 88 M352 130 L360 126 M316 72 L312 60 M362 112 L378 108 M316 108 L298 110"/>
          </g>
          <g fill="#7fa6c4" opacity=".38">
            <circle cx="322" cy="48" r="1.6"/><circle cx="352" cy="54" r="1.7"/><circle cx="374" cy="66" r="1.6"/>
            <circle cx="383" cy="86" r="1.7"/><circle cx="378" cy="108" r="1.6"/><circle cx="360" cy="126" r="1.7"/>
            <circle cx="326" cy="128" r="1.6"/><circle cx="298" cy="110" r="1.7"/><circle cx="300" cy="88" r="1.6"/><circle cx="312" cy="60" r="1.7"/>
          </g>
        </g>

        <!-- 段階5: 外縁の点群と足元のグリッド -->
        <g class="gs" data-s="5">
          <g stroke="#7fa6c4" stroke-opacity=".14" stroke-width=".7" fill="none">
            <path d="M316 42 L340 36 L364 42 L384 58 L394 78 L394 106 L382 126 L362 140 L338 146 L314 138 L296 122 L288 98 L290 74 L302 56 L316 42"/>
            <path d="M316 42 L322 48 M340 36 L352 54 M364 42 L374 66 M384 58 L383 86 M394 106 L378 108 M382 126 L360 126 M338 146 L326 128 M296 122 L298 110 M288 98 L300 88 M290 74 L312 60 M302 56 L322 48 M362 140 L360 126 M314 138 L326 128 M394 78 L383 86 M340 62 L340 36"/>
          </g>
          <g fill="#7fa6c4" opacity=".28">
            <circle cx="316" cy="42" r="1.3"/><circle cx="340" cy="36" r="1.5"/><circle cx="364" cy="42" r="1.3"/>
            <circle cx="384" cy="58" r="1.4"/><circle cx="394" cy="78" r="1.5"/><circle cx="394" cy="106" r="1.4"/>
            <circle cx="382" cy="126" r="1.4"/><circle cx="362" cy="140" r="1.5"/><circle cx="338" cy="146" r="1.3"/>
            <circle cx="314" cy="138" r="1.4"/><circle cx="296" cy="122" r="1.5"/><circle cx="288" cy="98" r="1.4"/>
            <circle cx="290" cy="74" r="1.5"/><circle cx="302" cy="56" r="1.4"/>
          </g>
          <g stroke="#7fa6c4" stroke-opacity=".14" stroke-width="1" fill="none">
            <path d="M120 196 L320 138 M220 199 L332 140 M340 199 L340 140 M460 196 L360 138 M560 199 L348 140"/>
            <path d="M250 152 H430 M215 166 H465 M170 183 H510"/>
          </g>
          <ellipse cx="340" cy="170" rx="120" ry="12" fill="#0b0e14" opacity=".55"/>
          <ellipse cx="340" cy="170" rx="120" ry="12" fill="none" stroke="#7fa6c4" stroke-opacity=".25"/>
        </g>

        <!-- 段階6: 軌道リングと左の点群 -->
        <g class="gs" data-s="6">
          <g fill="none">
            <g transform="rotate(-18 340 92)">
              <ellipse cx="340" cy="92" rx="74" ry="20" stroke="#7fa6c4" stroke-opacity=".5" stroke-width="1.1"/>
              <circle cx="266" cy="92" r="3" fill="#7fa6c4"/>
            </g>
            <g transform="rotate(24 340 92)">
              <ellipse cx="340" cy="92" rx="66" ry="15" stroke="#c8b273" stroke-opacity=".4" stroke-width="1" stroke-dasharray="5 6">
                <animateTransform attributeName="transform" type="rotate" from="0 340 92" to="360 340 92" dur="26s" repeatCount="indefinite"/>
              </ellipse>
              <circle cx="406" cy="92" r="2.6" fill="#c8b273"/>
            </g>
          </g>
          <g stroke="#7fa6c4" stroke-opacity=".22" stroke-width=".8" fill="none">
            <path d="M58 58 L96 72 L130 54 M96 72 L122 92 M58 58 L84 44 M130 54 L122 92"/>
            <path d="M74 122 L108 132 L142 118 M108 132 L120 112"/>
          </g>
          <g fill="#7fa6c4" opacity=".55">
            <circle cx="58" cy="58" r="1.8"/><circle cx="96" cy="72" r="2.2"/><circle cx="130" cy="54" r="1.8"/>
            <circle cx="122" cy="92" r="1.6"/><circle cx="84" cy="44" r="1.4"/>
            <circle cx="74" cy="122" r="1.6"/><circle cx="108" cy="132" r="2"/><circle cx="142" cy="118" r="1.6"/><circle cx="120" cy="112" r="1.4"/>
          </g>
        </g>

  queue = SCREEN_ORDER.map(d=>({dom:d, type:'scale', text:DOMAINS[d].screen, isScreen:true}));
  // 確認設問を入口の途中に混ぜる(見た目は通常の設問と同じ。スコアには入らない)
  queue.splice(3, 0, {rare:true, type:'scale', text:RARE_QS[0].text, follow:RARE_QS[0].follow});
  queue.splice(7, 0, {rare:true, type:'scale', text:RARE_QS[1].text, follow:RARE_QS[1].follow});
  phaseText = 'まずは全体を見ています';
  診断開始時刻 = Date.now();
  render();
}

function snapshot(){
  snapshots.push(JSON.stringify({queue, answered, phaseText, state, maxProg, built: stateBuiltDeep, meisai: 回答明細, itzr: いたずら点, skk: 深刻点}));
}
function goBack(){
  if(!snapshots.length) return;
  const s = JSON.parse(snapshots.pop());
  queue = s.queue; answered = s.answered; phaseText = s.phaseText; maxProg = s.maxProg;
  stateBuiltDeep = s.built;
  回答明細 = s.meisai || [];
  いたずら点 = s.itzr || 0;
  深刻点 = s.skk || 0;
  Object.assign(state, s.state);
  render();
}

function render(){
  const q = queue[0];
  if(!q){ return finish(); }
  const prog = answered/(answered+queue.length);
  maxProg = Math.max(maxProg, prog);
  $('pbar').style.width = (maxProg*100)+'%';
  $('phase').textContent = phaseText;
  // 説明文は最初の設問ページにだけ表示する
  const intro = $('intro');
  if(intro) intro.style.display = answered===0 ? '' : 'none';
  // タイトルも最初の設問ページにだけ表示する
  const qhead = $('qhead');
  if(qhead) qhead.style.display = answered===0 ? '' : 'none';
  // AIイラストは全設問ページに表示し、回答が進むほど点と線が増えて成長する。
  // 入口フェーズではまだ積まれていない深掘り分を見込んで分母を補正し、
  // 序盤で成長しきらず最後の設問まで進化が続くようにする(段階は巻き戻らない)
  const aiv = $('aiVisual');
  if(aiv){
    let est = answered + queue.length;
    if(!stateBuiltDeep){
      const flaggedNow = DOMS.filter(d=>state.screen[d]>=3).length;
      est += Math.round(flaggedNow * 2.5);
    }
    let vis = Math.max(成長段階, Math.min(14, Math.floor((answered/Math.max(est,1))*14) + 1));
    if(est - answered <= 1 && answered > 0) vis = 14;   // 見込み残り1問(=最後の設問)では全開にする
    成長段階 = vis;
    aiv.querySelectorAll('.gs').forEach(el=>{ el.style.opacity = (+el.dataset.s < vis) ? 1 : 0; });
  }
  $('qtext').textContent = q.text;
  const box = $('opts'); box.innerHTML='';
  const options = q.type==='scale'
    ? LIKERT.map(o=>({label:o.t, fn:()=>answerScale(q,o.v)}))
    : q.choices.map((c,i)=>({label:c.label, fn:()=>answerChoice(q,i)}));
  options.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=o.label; b.onclick=o.fn;
    box.appendChild(b);
  });
  $('backbtn').style.visibility = snapshots.length? 'visible':'hidden';
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  $('quiz').classList.remove('fade'); void $('quiz').offsetWidth; $('quiz').classList.add('fade');
}

function answerScale(q, v){
  snapshot();
  if(q.rare){
    // 確認設問: 領域スコアには入れず、信頼性判定と回答ログにだけ使う。
    // 「当てはまる」なら継続期間の深掘りを1問挟み、本当に深刻なケースといたずらを見分ける
    回答明細.push({dom:'rare', kind:'確認設問', text:q.text,
      label:(LIKERT.filter(o=>o.v===v)[0]||{}).t||'', value:v, sub:''});
    queue.shift(); answered++;
    if(v>=3 && q.follow){
      queue.unshift({rareFollow:true, type:'choice', text:q.follow.text, choices:q.follow.choices});
    }
    afterAnswer();
    return;
  }
  state.scale[q.dom].push(v);
  if(q.isScreen) state.screen[q.dom]=v;
  if(q.sub && v>=3) state.subPt[q.dom][q.sub]=(state.subPt[q.dom][q.sub]||0)+1;
  回答明細.push({dom:q.dom, kind:q.isScreen?'入口':'深掘り4件法', text:q.text,
    label:(LIKERT.filter(o=>o.v===v)[0]||{}).t||'', value:v, sub:q.sub||''});
  queue.shift(); answered++;
  afterAnswer();
}
function answerChoice(q, i){
  snapshot();
  const c = q.choices[i];
  if(q.rareFollow){
    // 確認設問の深掘り: 長期間の継続なら深刻ケース、そうでなければ信頼性の減点として扱う
    if(c.persistent) 深刻点++; else いたずら点++;
    回答明細.push({dom:'rare', kind:'確認深掘り', text:q.text, label:c.label, value:'', sub:c.persistent?'persistent':''});
    queue.shift(); answered++;
    afterAnswer();
    return;
  }
  if(c.sub) state.subPt[q.dom][c.sub]=(state.subPt[q.dom][c.sub]||0)+2;
  回答明細.push({dom:q.dom, kind:'深掘り選択', text:q.text, label:c.label, value:'', sub:c.sub||''});
  queue.shift(); answered++;
  if(c.skip) queue.splice(0, c.skip);   // 分岐で不要になった質問を飛ばす
  afterAnswer();
}
function afterAnswer(){
  // 入口が終わったら、引っかかった領域の深掘りを重い順に積む
  if(queue.length===0 && !stateBuiltDeep){
    stateBuiltDeep = true;
    const flagged = DOMS.filter(d=>state.screen[d]>=3)
      .sort((a,b)=>state.screen[b]-state.screen[a]);
    flagged.forEach(d=>{
      DOMAINS[d].deep.forEach(dq=>queue.push(Object.assign({dom:d}, dq)));
    });
    if(queue.length) phaseText = '気になるところを深掘りしています';
  }
  if(queue.length && !queue[0].isScreen && !queue[0].rare && !queue[0].rareFollow){
    phaseText = '深掘り中：'+DOMAINS[queue[0].dom].name;
  }
  render();
}
let stateBuiltDeep = false;

/* ============================================================
   集計と結果
============================================================ */
function severity(d){
  const arr = state.scale[d];
  if(!arr.length) return 0;
  const avg = arr.reduce((a,b)=>a+b,0)/arr.length;
  return Math.round((avg-1)/3*100);
}
function pickSub(d){
  const pts = state.subPt[d];
  // 廃止済みのサブタイプ(過去の保存レポートに残っている可能性がある)は無視する
  const keys = Object.keys(pts).filter(k=>SUB[d] && SUB[d][k]);
  if(!keys.length) return 'gen';
  keys.sort((a,b)=>pts[b]-pts[a]);
  return keys[0];
}

function finish(){
  const sev = {}; DOMS.forEach(d=>sev[d]=severity(d));
  const flagged = DOMS.filter(d=>state.screen[d]>=3).sort((a,b)=>sev[b]-sev[a]);
  const ranked = DOMS.map(d=>({d, s:sev[d]})).sort((a,b)=>b.s-a.s);
  const sovereign = Math.max(0, 100 - Math.round(DOMS.reduce((a,d)=>a+sev[d],0)/DOMS.length));
  const hist = historyUpdate(sovereign);
  const trust = いたずら点>=2 ? '低' : (いたずら点===1 ? '中' : '高');
  LAST = {sev, flagged, ranked, sovereign, hist, subPt: state.subPt, trust, serious: 深刻点>0};
  // 決済ページへ飛んでも結果が消えないよう保存(戻ってきたら復元して自動解錠)
  try{ localStorage.setItem('yoru_shindan_last', JSON.stringify(LAST)); }catch(e){}
  診断ログ送信(LAST);
  // 結果を出す前に「分析中」演出を2秒はさむ
  $('quiz').classList.add('hidden');
  const ana = $('analyzing');
  ana.classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
  setTimeout(()=>{ ana.classList.add('hidden'); renderResult(LAST); }, 2000);
}

/* ============================================================
   回答ログの蓄積（分析用・匿名）
   診断完了ごとに、全回答とスコアをレポートサーバーへ送って
   スプレッドシートに蓄積する。表示や診断結果には影響しない
============================================================ */
function 回答者ID(){
  let id = '';
  try{
    id = localStorage.getItem('yoru_shindan_uid') || '';
    if(!id){
      id = 'u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
      localStorage.setItem('yoru_shindan_uid', id);
    }
  }catch(e){ id = 'u_noLS'; }
  return id;
}
function 診断ログ送信(D){
  if(!REPORT_API) return;
  try{
    let histLen = 0;
    try{ histLen = (JSON.parse(localStorage.getItem('yoru_shindan_history')||'[]')).length; }catch(e){}
    const subPicked = {};
    (D.flagged.length ? D.flagged : [D.ranked[0].d]).forEach(d=>{ subPicked[d] = pickSub(d); });
    const body = JSON.stringify({
      action:'log',
      uid: 回答者ID(),
      sovereign: D.sovereign,
      typeName: buildTypeName(D.sovereign, D.flagged, D.ranked),
      sev: D.sev,
      screen: state.screen,
      flagged: D.flagged,
      subPicked: subPicked,
      subPt: state.subPt,
      answers: 回答明細,
      durationSec: 診断開始時刻 ? Math.round((Date.now()-診断開始時刻)/1000) : '',
      histCount: histLen,
      trust: D.trust || '',
      rarePts: いたずら点,
      seriousPts: 深刻点,
      referrer: document.referrer || '',
      ua: navigator.userAgent || '',
      lang: navigator.language || '',
      screenW: (window.screen && window.screen.width) || ''
    });
    // sendBeacon: 画面遷移やタブ閉じでも送信が生き残る。使えない環境はfetchで代替
    if(navigator.sendBeacon){
      const sent = navigator.sendBeacon(REPORT_API, new Blob([body], {type:'text/plain'}));
      if(sent) return;
    }
    fetch(REPORT_API, {method:'POST', headers:{'Content-Type':'text/plain'}, body:body, keepalive:true})
      .catch(function(){});
  }catch(e){ /* ログ送信の失敗は診断表示に影響させない */ }
}

/* 領域スコアの表示。内部計算は「高いほど問題が強い」のままだが、
   表示は 100-点数 に反転して「100点=良い/0点=悪い」で統一する。
   点数は大きめ太字+スコア帯で色分け(良い=緑/中間=金/悪い=赤) */
function 点数表示(良い点){
  const c = 良い点>=60 ? 'var(--good)' : (良い点>=40 ? 'var(--accent)' : 'var(--bad)');
  return `<span style="font-size:17px;font-weight:700;color:${c}">${良い点}点</span>`;
}

/* 点数の帯。強さのラベルと、いまの段階の一手の選択に使う。
   帯別の定型文は出さない（複数カードで同文が並ぶと定型文に見えるため廃止） */
function bandInfo(s){
  if(s>=80) return {idx:4, label:'かなり強い'};
  if(s>=60) return {idx:3, label:'強め'};
  if(s>=40) return {idx:2, label:'中くらい'};
  if(s>=20) return {idx:1, label:'弱まっている'};
  return {idx:0, label:'ごく弱い'};
}

/* スコア履歴。前回との差と推移を出す（この端末のブラウザに保存） */
function historyUpdate(score){
  let h=[]; try{h=JSON.parse(localStorage.getItem('yoru_shindan_history')||'[]');}catch(e){}
  const t=new Date();
  const dstr=(t.getMonth()+1)+'/'+t.getDate();
  const last=h.length? h[h.length-1] : null;
  const delta=last? score-last.s : null;
  if(last && last.d===dstr){ h[h.length-1]={d:dstr,s:score}; } else { h.push({d:dstr,s:score}); }
  if(h.length>12) h=h.slice(h.length-12);
  try{localStorage.setItem('yoru_shindan_history', JSON.stringify(h));}catch(e){}
  return {delta:delta, chips:h.slice(-8)};
}

/* 採点結果からタイプ名を組み立てる。
   主因と副因のサブタイプの掛け合わせ×強さの接頭語で、結果ごとに細かく名前が変わる */
function buildTypeName(sovereign, flagged, ranked){
  if(!flagged.length){
    if(sovereign>=90) return '睡眠力マスタータイプ';
    return stemOf(ranked[0].d)+'予備軍タイプ';
  }
  const s1 = stemOf(flagged[0]);
  const s2 = flagged.length>1? stemOf(flagged[1]) : null;
  const core = s2? s1+'×'+s2 : s1;
  let prefix = '';
  if(sovereign>=60) prefix = 'プチ';
  else if(sovereign>=25 && sovereign<40) prefix = 'がっつり';
  else if(sovereign<25) prefix = 'どっぷり';
  return prefix+core+'タイプ';
}

/* 総評。見出しは採点結果から組んだタイプ名、本文は8段階でスコアに応じて変わる。
   時期では変えない。同じスコアなら常に同じ内容 */
function buildWhy(sovereign, flagged, ranked){
  const tops = (flagged.length?flagged:[ranked[0].d]).slice(0,2);
  const names = tops.map(d=>'<b style="color:var(--accent)">'+DOMAINS[d].name+'</b>').join(' と ');
  const head = 'あなたは「'+buildTypeName(sovereign, flagged, ranked)+'」';
  if(sovereign>=90) return {head,
    body:`ここまで整った夜は、なかなかありません。もう直すところを探す段階ではなく、この状態を崩さないことだけが課題です。生活が変わる時期、繁忙期や引っ越しの前後だけ、また確認しに来てください。`};
  if(sovereign>=80) return {head,
    body:`夜の主導権は、はっきりあなたの側にあります。残っているのは ${names} のごく小さな揺らぎだけです。仕上げとして下の一手を押さえれば、満点の夜まであと一歩です。`};
  if(sovereign>=70) return {head,
    body:`大きな乱れは見当たりません。強いて挙げるなら ${names} に少し余地がある程度です。下の内容は、今の良さをさらに安定させるための調整として読んでください。`};
  if(sovereign>=60) return {head,
    body:`夜の骨格はできています。ただ ${names} のところで、ときどき主導権を手放している日があります。崩れる日の共通点はここに絞られているので、狙いを定めて整えやすい状態です。`};
  if(sovereign>=50) return {head,
    body:`いまのあなたの夜は、良い日と崩れる日のちょうど境目にいます。分かれ目を作っているのは ${names} です。ここは意志ではなく仕組みの問題なので、下の対処で境目を良い側に固定できます。`};
  if(sovereign>=40) return {head,
    body:`まだ立て直せる位置ですが、${names} を起点に、夜が崩れる日の方が増え始めています。放っておくと型として固まっていく段階なので、いまが動きどきです。下の最優先の一手から始めてください。`};
  if(sovereign>=25) return {head,

}

/* ============================================================
   タイプ別イラスト(生成SVG): スコア連動シナプス
   睡眠力スコアが低いほどシナプスが肥大化し、カオスに激しく動く。
   高いほど点と線が少なく整然と並び、洗練された静かな姿になる。
   配置・動きはスコアから決定論的に生成する(同じスコアなら同じ絵)
============================================================ */
function シナプス乱数(seed){
  const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}
function タイプイラスト(sovereign){
  const s = Math.max(0, Math.min(100, sovereign));
  const c = (100 - s) / 100;   // カオス度: 0=洗練, 1=カオス
  const cx = 340, cy = 130;
  const n = Math.round(12 + c * 38);   // 点の数 12〜50
  const nodes = [];
  for(let i = 0; i < n; i++){
    const r1 = シナプス乱数(i + 1), r2 = シナプス乱数(i * 3 + 7),
          r3 = シナプス乱数(i * 7 + 13), r4 = シナプス乱数(i * 11 + 29);
    // 整然とした円形リング配置と、円内に一様に散るランダム配置をカオス度でブレンドする
    const ang = (i / n) * Math.PI * 2;
    const ringX = cx + Math.cos(ang) * 78, ringY = cy + Math.sin(ang) * 78;
    const rr = Math.sqrt(r1) * (80 + c * 15);
    const ra = r2 * Math.PI * 2;
    const randX = cx + Math.cos(ra) * rr, randY = cy + Math.sin(ra) * rr;
    const x = ringX * (1 - c) + randX * c, y = ringY * (1 - c) + randY * c;
    const z = r3;   // 奥行き: 0=奥(小さく暗い) 1=手前(大きく明るい)
    const size = (.9 + z * 1.3) * (1 + c * .5);
    const dur = ((8.5 - c * 3) * (.7 + r4 * .6)).toFixed(2);
    const amp = (6 + c * 14) * (.5 + z * .8);
    const dx = ((r1 - .5) * 2 * amp).toFixed(1), dy = ((r2 - .5) * 2 * amp).toFixed(1);
    const col = (c > .55 && r4 > .55) ? '#c98a7a' : (r3 > .5 ? '#7fa6c4' : '#c8b273');
    nodes.push({x, y, z, size, dur, dx, dy, col, op: .35 + z * .55});
  }
  let edges = '';
  const maxD = 75 + c * 115;
  for(let i = 0; i < n; i++){
    for(let j = i + 1; j < Math.min(n, i + 7); j++){
      const a = nodes[i], b = nodes[j];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const extra = c > .4 && シナプス乱数(i * 31 + j * 17) > .9;   // カオス時は遠距離の交差線も足す
      if(d < maxD || extra){
        const op = Math.max(.06, (extra ? .3 : (1 - d / maxD) * .55) * (.4 + Math.min(a.z, b.z) * .6));
        const flick = c > .5 ? ` class="syn-flick" data-fd="${(1.4 + シナプス乱数(i + j * 3) * 2.4).toFixed(2)}"` : '';
        edges += `<line${flick} x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="${a.z > b.z ? a.col : b.col}" stroke-opacity="${op.toFixed(2)}" stroke-width="${(.5 + Math.min(a.z, b.z) * .9).toFixed(2)}"/>`;
      }
    }
  }
  const dots = nodes.map(p => `<g class="syn-dot" data-dx="${p.dx}" data-dy="${p.dy}" data-dur="${p.dur}">
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.size.toFixed(1)}" fill="${p.col}" opacity="${p.op.toFixed(2)}"/>
    </g>`).join('');
  const coreR = 7 + c * 7;
  const coreDur = (3.4 - c * 2.5).toFixed(2);
  const spin = (130 - c * 105).toFixed(0);   // 全体の回転: 洗練=ゆっくり, カオス=速い
  const calmRing = c < .45 ? `<circle cx="${cx}" cy="${cy}" r="95" fill="none" stroke="#7fa6c4" stroke-opacity="${(.4 - c * .5).toFixed(2)}" stroke-width="1"/>` : '';
  const chaosGlow = c > .5 ? `<circle class="syn-pulse" data-cd="1.8" cx="${cx}" cy="${cy}" r="${(60 + c * 40).toFixed(0)}" fill="#c98a7a" fill-opacity="${(c * .13).toFixed(2)}" filter="url(#tiSoft)"/>` : '';
  return `<div class="typesvg-wrap"><svg viewBox="0 0 680 260" width="100%" style="display:block" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="睡眠力スコアに応じて姿を変えるシナプスのイメージ">
    <defs>
      <filter id="tiSoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    </defs>
    ${chaosGlow}
    <circle cx="120" cy="34" r="1.5" fill="#e9e6dc" opacity=".5"/>
    <circle cx="560" cy="160" r="1.4" fill="#7fa6c4" opacity=".5"/>
    <circle cx="610" cy="52" r="1.4" fill="#e9e6dc" opacity=".45"/>
    <g class="syn-rot" data-spin="${spin}">
      ${calmRing}
      ${edges}
      ${dots}
      <circle cx="${cx}" cy="${cy}" r="${(coreR * 2).toFixed(1)}" fill="#4a6fa5" fill-opacity=".25" filter="url(#tiSoft)"/>
      <circle class="syn-pulse" data-cd="${coreDur}" cx="${cx}" cy="${cy}" r="${coreR.toFixed(1)}" fill="#4a6fa5"/>
    </g>
  </svg></div>`;
}

// 後から挿入したSVGは、SMILもCSSキーフレームも環境によって動かない(iOS Safari等)。
// Web Animations API なら挿入後のSVG要素も確実に動かせるため、結果表示のたびに呼ぶ
function シナプス起動(root){
  if(!root || !root.querySelectorAll || !Element.prototype.animate) return;
  root.querySelectorAll('.syn-dot').forEach(el=>{
    const dx = parseFloat(el.dataset.dx)||0, dy = parseFloat(el.dataset.dy)||0;
    el.animate([
      {transform:'translate(0px,0px)'},
      {transform:'translate('+dx+'px,'+dy+'px)'},
      {transform:'translate(0px,0px)'},
    ], {duration:(parseFloat(el.dataset.dur)||6)*1000, iterations:Infinity, easing:'ease-in-out'});
  });
  root.querySelectorAll('.syn-rot').forEach(el=>{
    el.animate([{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],
      {duration:(parseFloat(el.dataset.spin)||120)*1000, iterations:Infinity});
  });
  root.querySelectorAll('.syn-pulse').forEach(el=>{
    el.animate([{opacity:1},{opacity:.5},{opacity:1}],
      {duration:(parseFloat(el.dataset.cd)||3)*1000, iterations:Infinity, easing:'ease-in-out'});
  });
  root.querySelectorAll('.syn-flick').forEach(el=>{
    el.animate([{opacity:1},{opacity:.1},{opacity:1}],
      {duration:(parseFloat(el.dataset.fd)||1.2)*1000, iterations:Infinity, easing:'ease-in-out'});
  });
}

/* 決済完了後の完全版の先頭に、専用URLをメールで受け取る入口を差し込む。
   発行はsubmitBuy(保存+メール送信)を使い回す */
function 専用URL発行ブロック(prem){
  if(!REPORT_API || !prem) return;
  const rb = prem.querySelector('.repbody');
  if(!rb || document.getElementById('buyMail')) return;
  const div = document.createElement('div');
  div.className = 'sec noprint';
  div.innerHTML = `
    <h3>専用URLをメールで受け取る</h3>
    <p class="mech" style="font-size:13.5px">この画面を閉じても読み直せるよう、完全版レポートの専用URLをメールでお送りします。LINEなどアプリ内ブラウザの方は、先に受け取っておくと安心です。</p>
    <input class="mailin" id="buyMail" type="email" placeholder="メールアドレス" autocomplete="email">
    <button class="btn" style="margin-top:10px" onclick="submitBuy()">専用URLを受け取る</button>
    <p class="gn" id="buyMsg" style="font-size:12.5px;margin-top:8px"></p>`;
  rb.insertBefore(div, rb.firstChild);
}

function submitBuy(){
  const input = document.getElementById('buyMail');
  const msg = document.getElementById('buyMsg');
  const em = (input && input.value || '').trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){
    if(msg) msg.textContent = 'メールアドレスの形式を確認してください。';
    return;
  }
  if(msg) msg.textContent = '送信しています…';
  fetch(REPORT_API, {
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({action:'save', email:em, result:LAST, uid:回答者ID(), paid:CAME_FROM_PAY})
  }).then(function(r){ return r.json(); }).then(function(j){
    if(j && j.ok){
      const prem = document.querySelector('.prem');
      prem.innerHTML = buildPremium(LAST);
      const body = prem.querySelector('.repbody');
      if(body){
        const note = document.createElement('p');
        note.className = 'paidnote';
        note.style.margin = '18px 18px 0';
        note.innerHTML = '専用URLを <b>'+em+'</b> に送りました。メールのリンクから、いつでもこのレポートを開けます。<br>届いていない場合は、迷惑メールフォルダもご確認ください。';
        body.insertBefore(note, body.firstChild);
      }
      prem.scrollIntoView({behavior:'smooth', block:'start'});
    }else{
      if(msg) msg.textContent = '送信に失敗しました。時間をおいてもう一度お試しください。';
    }
  }).catch(function(){
    if(msg) msg.textContent = '通信に失敗しました。電波の良い場所でもう一度お試しください。';
  });
}
/* 該当しなかった領域のカード。良い順に2枚は「強み」、残りは「維持」として表示する */
function keepCard(d, sev, isStrength, withSupport){

  }).join('') : '';
  const s = SVC[d];
  const support = (withSupport && s) ? `
      <div class="lab">毎日の実行を支えるサポート</div>
      <div class="svc2"><b>${s.title}</b><br>${s.body}
        <br><button class="btn2" style="margin-top:10px" onclick="gotoLine()">${s.cta}</button></div>` : '';
  return `<div class="diag">
    <div class="dh">
      <div class="dt">${DOMAINS[d].name}　${点数表示(100-sev[d])}<span style="margin-left:8px;font-size:13px;font-weight:400;color:var(--sub)">${isStrength?'とても良好':'維持できています'}</span></div>
      ${isStrength?'<div class="ds" style="margin-top:4px"><span class="pri" style="margin-left:0;vertical-align:0;background:var(--good)">あなたの強み</span></div>':''}
    </div>
    <div class="db">
      <p class="mech">${k.strength}</p>
      <div class="lab">崩れやすい引き金</div>
      <p class="mech">${k.trigger}</p>
      <div class="lab">保つためにできること</div>
      <ul class="acts">${k.keep.map(a=>`<li>${a}</li>`).join('')}</ul>
      ${goods?`<div class="lab">保つのに効く道具　価格は実売の目安</div><ul class="goods">${goods}</ul>`:''}
      ${support}
    </div>
  </div>`;
}
function buildPremium(D){
  const {sev, flagged, ranked} = D;
  const targets = flagged;
  // 該当しなかった領域は良い順に並べ、上位2つを強み・残りを維持カードにして全9領域を網羅する
  const keepDoms = ranked.map(r=>r.d).filter(d=>flagged.indexOf(d)===-1).reverse();
  const strengths = keepDoms.slice(0,2);
  const keeps = keepDoms.slice(2);
  // グッズとLINEサポートは各カード内に埋め込む(別セクションは持たない)
  // 30日設計は常に4週。該当領域で埋まらない週は守りのメニューで埋める
  const weekItems = targets.slice(0,4).map((d,i)=>{
    const sub = SUB[d][pickSub(d)];
    return `<li><b>第${i+1}週　${DOMAINS[d].name}</b><br>${sub.acts[0]}</li>`;
  });
  for(let i=weekItems.length; i<4; i++){
    weekItems.push(`<li><b>第${i+1}週　守りを固める</b><br>${KEEP_WEEKS[i]}</li>`);
  }
  const weeks = weekItems.join('');
  const allCards = targets.map((d,i)=>diagCard(d,i,sev,true,true)).join('')
    + strengths.map(d=>keepCard(d,sev,true,true)).join('')
    + keeps.map(d=>keepCard(d,sev,false,true)).join('');
  return `
    <div class="head">
      <div class="t">完全版レポート${CAME_FROM_PAY?'':'　テスト表示中'}</div>
      <div class="s">すべての診断と、続けるための30日設計・毎日のサポート</div>
    </div>
    <div class="repbody">
      <p class="intro">見つかった診断のすべてと、<b style="color:var(--accent)">整っている領域の強みと維持のポイント</b>、それを<b style="color:var(--accent)">30日で定着させる順番</b>、<b style="color:var(--accent)">支える道具とサポート</b>をまとめました。一度に全部ではなく、週にひとつずつで十分です。</p>
      <div class="sec">
        <h3>全9領域の診断カード　完全版</h3>
        ${allCards}
      </div>
      <div class="sec">
        <h3>改善ロードマップ</h3>
        <p class="mech">${targets.length>1
          ? DOMAINS[targets[0]].name+'と'+DOMAINS[targets[1]].name+'に原因があるあなたのための、30日の立て直しロードマップです。影響の大きいところから、週にひとつずつ仕組みを変えていきます。'
          : targets.length===1
            ? DOMAINS[targets[0]].name+'に原因があるあなたのための、30日の立て直しロードマップです。焦らず、週にひとつずつ仕組みを変えていきます。'
            : '大きな崩れが見つからなかったあなたのための、良い状態を固定する30日の設計です。守りを週にひとつずつ点検していきます。'}</p>
        <ol class="rep">${weeks}</ol>
      </div>
      <div class="sec">
        <h3>3ヶ月後の再診断</h3>
        <ul class="rep"><li>同じ診断にもう一度答えると、睡眠力スコアの変化を確認できます。行動の定着には平均66日かかるという研究報告があります。60日を過ぎたあたりでの再診断がおすすめです。</li></ul>
        <div class="feat noprint" style="margin-top:14px">
          この画面を一度閉じると、再び表示することはできません。商品の性質上、閲覧済みのレポートの返金にも応じられません。<br>
          上部の<b>「専用URLをメールで受け取る」</b>から専用URLの送信を済ませ、<b>メールが届いているかを今この場でご確認ください</b>。メールのリンクからは、いつでもこのレポートを開き直せます。<br>
          メールが見つからない場合は、<b>迷惑メールフォルダ</b>もあわせてご確認ください。
        </div>
        ${CAME_FROM_PAY?'':'<p class="testnote">※現在はテスト動作です(決済なしで解錠されます)。本番ではStripe決済 ¥780 の完了後に、専用URLの発行とメール送信を行います。</p>'}
      </div>

}

/* 起動処理。
   - 決済成功で ?paid=1 付きで戻ってきたら: 購入フラグを保存→保存済みの診断結果を復元→完全版を自動で開く
   - それ以外: 開いた瞬間に最初の質問から開始(購入済みなら診断完了時に完全版が自動で開く) */
function boot(){
  const p = new URLSearchParams(location.search);
  if(p.get('reset')==='1'){
    // テスト用: 購入フラグと保存結果を消す(スコア履歴は残す)
    try{ localStorage.removeItem('yoru_shindan_paid'); localStorage.removeItem('yoru_shindan_last'); }catch(e){}
    history.replaceState(null, '', location.pathname);
  }
  if(p.get('paid')==='1'){
    CAME_FROM_PAY = true;
    history.replaceState(null, '', location.pathname);
  }
  // 専用URL(?r=ID)で開かれた場合: サーバーから保存済みレポートを取得し、完全版を開いた状態で表示
  const rid = p.get('r');
  if(rid && REPORT_API){
    $('quiz').classList.add('hidden');
    const r = $('result');
    r.classList.remove('hidden');
    r.innerHTML = '<div class="card"><p class="body" style="text-align:center">保存されたレポートを読み込んでいます…</p></div>';
    fetch(REPORT_API + '?id=' + encodeURIComponent(rid))
      .then(function(res){ return res.json(); })
      .then(function(j){
        if(j && j.ok && j.result && j.result.ranked){
          state.subPt = j.result.subPt || state.subPt;
          LAST = j.result;
          renderResult(LAST);
          // 専用URLは購入者専用=完全版を開いた状態で表示
          const prem = document.querySelector('.prem');
          if(prem) prem.innerHTML = buildPremium(LAST);
        }else{
          r.innerHTML = '<div class="card"><p class="body">レポートが見つかりませんでした。メールに記載のURLをもう一度ご確認ください。</p><button class="back" onclick="location.href=location.pathname">診断ページへ戻る</button></div>';
        }
      })
      .catch(function(){
        r.innerHTML = '<div class="card"><p class="body">読み込みに失敗しました。通信環境の良い場所で、もう一度開いてみてください。</p></div>';
      });
    return;
  }
  if(CAME_FROM_PAY){
    let saved = null;
    try{ saved = JSON.parse(localStorage.getItem('yoru_shindan_last')||'null'); }catch(e){}
    if(saved && saved.ranked){
      state.subPt = saved.subPt || state.subPt;   // サブタイプ判定の内部状態も復元
      LAST = saved;
      renderResult(saved);
      // 決済完了で戻ってきた場合のみ、完全版を開いた状態にし、専用URLの発行入口を出す
      const prem = document.querySelector('.prem');
      if(prem){
        prem.innerHTML = buildPremium(saved);
        専用URL発行ブロック(prem);
        setTimeout(function(){ prem.scrollIntoView({behavior:'smooth', block:'start'}); }, 400);
      }
      return;
    }
  }
  init();
}
boot();
